        .app-bar {

            padding: 10px 20px;

            z-index: 1000;

        .app-title {
            font-size: 0.9rem;
            color: var(--accent-gold);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .app-actions {
            display: flex;
            gap: 10px;
        }
        .btn-tab {

            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 6px;

        .btn-tab:hover, .btn-tab.active {

            font-weight: 600;

            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-copy:hover {
            background: #1d4ed8;
        }

        .code-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 2000;
            padding: 30px;
            flex-direction: column;

        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .modal-title {
            color: var(--accent-gold);
            font-size: 1.2rem;
        }
        .modal-close {
            background: transparent;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .code-container {
            flex: 1;
            background: #0d1117;
            border-radius: 8px;
            border: 1px solid #30363d;
            padding: 20px;
            overflow: auto;
            font-family: 'Courier New', Courier, monospace;
            color: #e6edf3;
            white-space: pre;
            font-size: 0.88rem;

           UKŁAD STRONY - 5 SEKCJI (PIĘCIOPODZIAŁ)

            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 20px;

            position: relative;
            z-index: 10;

            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: #fff;
        }

        .main-container {
            display: flex;
            flex: 1;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }

        aside.left-sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-right: 1px solid var(--glass-border);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;

            font-size: 1.05rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            border-bottom: 2px solid rgba(255,255,255,0.08);
            padding-bottom: 10px;

        aside.left-sidebar nav ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        aside.left-sidebar nav a {
            text-decoration: none;
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: 8px;
            background: rgba(255,255,255,0.03);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        aside.left-sidebar nav a:hover {
            background: rgba(255,255,255,0.08);
            transform: translateX(4px);
        }
        aside.left-sidebar nav li.active a {
            background: rgba(229, 169, 59, 0.15);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            font-weight: 600;
        }

        main.main-content {
            flex: 1;
            padding: 40px;
            background: rgba(13, 16, 22, 0.6);
            overflow-y: auto;
        }
        .content-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            max-width: 900px;
            margin: 0 auto;
        }
        .content-card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--accent-gold);
            margin-bottom: 20px;
        }

        .body-image {
            width: 100%;
            max-height: 380px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .content-card p {
            line-height: 1.8;
            color: #d1d5db;
            font-size: 1.05rem;
            margin-bottom: 20px;
        }
        .highlight-box {
            background: rgba(229, 169, 59, 0.08);
            border-left: 4px solid var(--accent-gold);
            padding: 15px 20px;
            border-radius: 0 8px 8px 0;
            margin: 20px 0;
            font-style: italic;
            color: #e5e7eb;
        }

        /* 4. PRAWY MARGINES (REKLAMY) - Stała szerokość 260px */
        aside.right-sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-left: 1px solid var(--glass-border);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;

            color: var(--text-secondary);
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 8px;

            border-radius: 10px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: block;

            width: 100%;
            height: 130px;
            object-fit: cover;
            display: block;

        .ad-caption {
            padding: 10px;
            font-size: 0.8rem;
            text-align: center;
            color: var(--text-secondary);
            background: rgba(15, 20, 28, 0.8);

            height: var(--footer-height);
            background: var(--glass-bg);
            backdrop-filter: blur(12px);

            align-items: center;
            justify-content: center;
            padding: 0 20px;

            color: var(--text-secondary);

            color: var(--text-primary);

            color: var(--accent-gold);
            text-decoration: none;
            font-weight: 600;

            aside.left-sidebar, aside.right-sidebar { width: 100%; min-width: 100%; }

                `

                    <p>Halloween to zwyczaj związany z maskaradą, obchodzony w wielu krajach w wieczór 31 października. Odnosi się do wigilii dnia Wszystkich Świętych i ma swoje korzenie w dawnym celtyckim święcie Samhain.</p>

                    <p>Najpopularniejszymi zwyczajami halloweenowymi są zabawa „cukierek albo psikus” (trick or treat), organizowanie domowych imprez kostiumowych oraz wycinanie fantazyjnych wzorów w dyniach.</p>

                    <div class="highlight-box" style="border-color: #ff4d4d; background: rgba(255, 77, 77, 0.08);">

                    </div>
                    <p>W całym kraju odbywają się uroczyste mecze, Marsze Niepodległości, biegi oraz parady. W Poznaniu i wielu innych miastach tradycją stało się wypiekanie i jedzenie słynnych Rogali Świętomarcińskich.</p>
                `

        function switchPage(pageKey) {
            currentPageKey = pageKey;
            const data = pagesData[pageKey];

            document.getElementById('header-title').innerText = data.title;

            document.querySelectorAll('aside.left-sidebar nav li').forEach(li => li.classList.remove('active'));
            document.getElementById(`nav-${pageKey}`).classList.add('active');

            document.querySelectorAll('.app-actions .btn-tab').forEach(btn => btn.classList.remove('active'));
            const btnIdx = pageKey === 'swieto' ? 0 : pageKey === 'halloween' ? 1 : 2;
            document.querySelectorAll('.app-actions .btn-tab')[btnIdx].classList.add('active');

            // Wstrzyknięcie głównej treści wraz ze zdjęciem w tekście
            const mainContent = document.getElementById('main-content-area');
            mainContent.innerHTML = `
                <article class="content-card">
                    <h2>${data.heading}</h2>
                    <img src="${data.image}" alt="${data.title}" class="body-image">
                    ${data.content}
                </article>
            `;
        }

        function openCodeModal() {
            const data = pagesData[currentPageKey];
            document.getElementById('modalFilename').innerText = `Kod pliku: ${data.filename}`;
            document.getElementById('codeText').textContent = generateSinglePageHTML(currentPageKey);
            document.getElementById('codeModal').classList.add('active');
        }

        function closeCodeModal() {
            document.getElementById('codeModal').classList.remove('active');
        }

        function copyModalCode() {
            const code = document.getElementById('codeText').textContent;
            const textarea = document.createElement('textarea');
            textarea.value = code;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            alert('Kod pliku został skopiowany do schowka!');
        }

        window.onload = () => switchPage('swieto');
    </script>
