<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Czarny napis na środku</title>
    <style>
        /* Ustawienie pełnej wysokości strony i wyśrodkowanie zawartości */
        body {
            margin: 0;
            height: 100vh; /* 100% wysokości okna przeglądarki */
            display: flex;
            justify-content: center; /* Wyśrodkowanie w poziomie */
            align-items: center;     /* Wyśrodkowanie w pionie */
            background-color: white; /* Tło białe dla kontrastu */
        }
        h1 {
            color: black; /* Czarny kolor tekstu */
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <h1>5C_MUMOT_STANISŁAW</h1>
</body>
